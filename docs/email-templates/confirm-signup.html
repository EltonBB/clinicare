<!-- Supabase › Authentication › Email Templates › Confirm signup.
     Subject: Confirm your email for Vela
     The link must stay on {{ .TokenHash }} (see README.md). -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#f4f5f9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f9;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border:1px solid #e3e6ef;border-radius:12px;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#14152f;">
            <tr>
              <td style="padding:32px 32px 0;">
                <p style="margin:0;font-size:18px;font-weight:700;letter-spacing:-0.01em;">
                  <span style="color:#0a22ff;">&#9670;</span> Vela
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 0;">
                <h1 style="margin:0;font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-0.02em;">Confirm your email</h1>
                <p style="margin:12px 0 0;font-size:15px;line-height:1.6;color:#5b6980;">
                  You're one step from your clinic workspace. Confirm this address and we'll take you to setup.
                </p>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 0;">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/dashboard"
                   style="display:inline-block;background:#14152f;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:13px 24px;border-radius:8px;">
                  Confirm email
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 32px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#8a93a6;">
                  If you didn't create a Vela account, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
