name: PostgreSQL integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: postgres-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vela_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: vela_integration_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U vela_test -d vela_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      VELA_TEST_DATABASE_URL: postgresql://vela_test:synthetic-ci-password@127.0.0.1:55432/vela_integration_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run test:integration:safety
      - run: npm run test:integration
